# Where the backend lives, for the single-container image.
#
# Node runs beside nginx in this image, so the backend is loopback and no name
# resolution is involved.
#
# This exists as a separate file because the split deployment puts Node in its
# own container, and the location blocks are shared between the two. Hard-coding
# 127.0.0.1:3001 in those shared blocks is what made the split layout fail
# silently: nginx proxied to a loopback port with nothing behind it and returned
# 502 to every biometric reader for 145 days.
map "" $neevtime_backend {
    default "http://127.0.0.1:3001";
}
