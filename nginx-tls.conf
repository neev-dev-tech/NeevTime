# TLS configuration. Used only when TLS_ENABLED=true; docker-entrypoint.sh
# installs it over the default and generates a self-signed certificate first if
# none is mounted.
#
# The shape of this file is dictated by one constraint: the eSSL readers run
# iClock firmware and are not to be trusted with TLS. So port 80 stays open and
# keeps serving /iclock/ in clear text, and only browser traffic is redirected.
# A blanket `return 301 https://` on port 80 would silently stop attendance
# collection, which is why /iclock/ is matched first below — nginx prefers the
# longest matching prefix, so it wins over the catch-all redirect.

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Readers keep talking plain HTTP here. Must come before the redirect.
    include /etc/nginx/iclock.conf;

    # The healthcheck runs inside the container against HTTP; leaving it here
    # avoids making the container's liveness depend on certificate validity.
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Everything else is a browser. Send it to TLS.
    location / {
        # 308, not 301. A client following a 301 or 302 is permitted to
        # rewrite POST as GET, and browsers and fetch() both do. So an API call
        # that arrived on port 80 reached the application as a GET — which is
        # how the smoke test's POST /api/login turned into GET /api/login and
        # came back 401. 308 preserves the method and the body.
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # HTTP/2 is deliberately OFF.
    #
    # WebSockets cannot be established over HTTP/2 by the classic
    # Connection: Upgrade handshake — that header is a protocol error in h2, and
    # nginx rejects it with 400. The h2 mechanism for websockets is RFC 8441
    # Extended CONNECT, which nginx does not implement.
    #
    # Measured, not assumed. The same handshake through this proxy:
    #     over HTTP/2    ->  400
    #     over HTTP/1.1  ->  101 Switching Protocols
    # and node answers 101 when asked directly, so neither the app nor the proxy
    # configuration is at fault.
    #
    # With h2 on, socket.io fell back to polling on every screen with a live
    # feed and filled the console with failed upgrades — ten of forty-seven
    # screens. The live monitor is a feature of this product; h2 multiplexing on
    # a LAN admin application is a marginal first-load gain. If h2 is ever worth
    # having back, the answer is a proxy that implements RFC 8441, not turning
    # this line on again.
    # http2 on;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 1.2 is kept because some older office browsers and scanners still need
    # it; 1.0 and 1.1 are not offered at all.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is emitted by the shared security-headers include, driven by the
    # $hsts_value map — see nginx-hsts-map.conf for why it cannot live here.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    include /etc/nginx/app-locations.conf;
    # Served here too, so a reader that *can* do TLS is not turned away.
    include /etc/nginx/iclock.conf;
}
