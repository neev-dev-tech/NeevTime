# Loaded at http level (this file lives under conf.d/, which nginx.conf
# auto-includes) so the shared security-headers file can emit HSTS only over
# TLS, without needing a second copy of every location block.
#
# The alternative — declaring Strict-Transport-Security once on the TLS server
# block — silently does nothing: add_header does not inherit into any location
# that sets its own, and every location here does. That was measured, not
# assumed; the header was simply absent from every response.
#
# nginx omits a header whose value is empty, so on plain HTTP this expands to
# nothing at all.
#
# It is also a no-op while the app is reached by IP: HSTS applies to host names,
# not addresses (RFC 6797). It begins protecting people the day this box gets a
# DNS name. Lower max-age to 300 while first testing — a browser honours the
# policy long after you change your mind about it.
map $scheme $hsts_value {
    https   "max-age=31536000";
    default "";
}
