<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NeevTime">
  <!--
    PLACEHOLDER brand mark — green and white, matching the agreed logo colours.
    index.html originally referenced /favicon.png, which has never existed in the
    repo, so the tab icon 404'd.

    To swap in the real logo: drop the file into client/public/ and point the
    <link rel="icon"> in client/index.html and the <img> in
    src/layouts/MainLayout.jsx at it. A PNG is fine — at 16-64px it is
    indistinguishable from vector.
  -->
  <circle cx="32" cy="32" r="30" fill="#2E5411"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#FFFFFF" stroke-width="3.6"/>
  <!-- hands at roughly 9:00, the start of a working day -->
  <path d="M32 21 V32 H23" fill="none" stroke="#FFFFFF" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
