# Where the backend lives, for the split deployment: its own container.
#
# `resolver` and a variable, deliberately, rather than an upstream block. nginx
# resolves a hostname in an upstream once at startup and caches the address
# forever, so recreating the server container — which docker compose does on
# every deploy — leaves nginx proxying to an address nothing answers on. That is
# the exact failure this whole change exists to prevent, and it would have been
# reintroduced by the obvious implementation.
#
# 127.0.0.11 is Docker's embedded DNS. valid=10s re-resolves.
resolver 127.0.0.11 valid=10s ipv6=off;

map "" $neevtime_backend {
    default "http://server:3001";
}
