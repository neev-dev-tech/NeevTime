# HTTP-only configuration — the default, and what runs today.
#
# docker-entrypoint.sh swaps in nginx-tls.conf instead when TLS_ENABLED=true.
# The location blocks live in shared includes so the two configurations cannot
# drift apart.

server {
    listen 80;
    server_name localhost;

    # Do not advertise the nginx version to anyone scanning the host.
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    include /etc/nginx/app-locations.conf;
    include /etc/nginx/iclock.conf;
}
