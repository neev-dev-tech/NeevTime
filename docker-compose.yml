version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: attendance_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-attendance_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The authoritative schema, loaded on an empty data directory.
      #
      # Nothing loaded this file at deploy time — not compose, not either
      # Dockerfile — so a genuinely fresh install got only what ensureSchema
      # creates, which does not include the users table. The application could
      # not have worked at all on a new machine. This deployment survives
      # because its database predates every schema file in the repository.
      #
      # Postgres runs /docker-entrypoint-initdb.d only when the data directory
      # is empty, so this can never re-run against an existing database.
      - ./database/000_schema.sql:/docker-entrypoint-initdb.d/000_schema.sql:ro
    networks:
      - app-network
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-attendance_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend Server Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: attendance_server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=3001
      - DB_SERVER=db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-admin}
      - DB_NAME=${DB_NAME:-attendance_db}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET:-super_secret_key_123}
      # Only read on first boot, and only when no user exists. Leave it unset
      # and the first administrator's password is generated and printed once to
      # this container's log.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    ports:
      - "3001:3001"
    volumes:
      # Backups MUST outlive the container.
      #
      # BACKUP_DIR is /app/backups inside the container and there was no mount
      # here, so every nightly dump was written to the container's own writable
      # layer and destroyed by the next `docker compose up --build`. Backups
      # were enabled, running and succeeding the whole time; the files simply
      # stopped existing on each deploy. The only survivor was one from 26 March
      # that happens to sit in the build context and gets COPY'd into the image,
      # which made it look like the scheduler had stopped in March.
      - backups:/app/backups
    networks:
      - app-network

  # Frontend Client Service
  client:
    build:
      # Repo root, not ./client: the nginx configuration is shared with the
      # single-container image and lives at the root, and a build context
      # cannot reach above itself.
      context: .
      dockerfile: client/Dockerfile
    container_name: attendance_client
    restart: always
    depends_on:
      - server
    environment:
      - TLS_ENABLED=${TLS_ENABLED:-true}
      - TLS_COMMON_NAME=${TLS_COMMON_NAME:-neevtime.local}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The self-signed pair must outlive the container. Without this every
      # deploy issues a new certificate and every browser shows a fresh warning,
      # which teaches people to click through them.
      - nginx_certs:/etc/nginx/certs
    networks:
      - app-network

volumes:
  # PINNED, and external on purpose.
  #
  # On 2026-08-16 a deploy brought the stack up on `neevtime_pgdata` — the name
  # compose derives from the key `pgdata` — while the live database has always
  # been `neevtime_postgres_data`. Postgres started happily on a stale copy
  # whose last row was from 24 March, the application served it without
  # complaint, and it took hours to work out that the missing five months of
  # data had never been missing at all: the service was simply mounted on the
  # wrong disk.
  #
  # `name:` stops the volume identity depending on a YAML key that anyone might
  # tidy up. `external: true` means compose FAILS if that volume is absent
  # rather than creating an empty one and quietly starting a blank database —
  # which is the failure that happened here, and it announced itself as data
  # loss.
  #
  # A genuinely new install therefore needs this once, deliberately:
  #     docker volume create neevtime_postgres_data
  pgdata:
    name: neevtime_postgres_data
    external: true
  nginx_certs:
  backups:
    name: neevtime_backups


networks:
  app-network:
    driver: bridge
