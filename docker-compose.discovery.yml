# LAN device discovery — OPT-IN overlay.
#
# Device discovery (the "Search LAN" button) is an L2 operation: it ping-sweeps
# the local segment, reads the ARP table, and broadcasts a ZKTeco/eSSL search.
# None of that can cross the docker bridge the main server runs on, so by
# default "Search LAN" finds nothing in a containerised install.
#
# This overlay adds a small companion container that runs with the HOST's
# network stack, so it sees the real office LAN and the readers on it. The main
# server is unchanged except for being told where the agent is; it still owns the
# database and every decision. Nothing here auto-registers a device — discovery
# only surfaces candidates for an admin to add/approve.
#
# Enable it:
#   1. Ensure DISCOVERY_AGENT_TOKEN is set in .env (install.sh generates one).
#   2. docker compose -f docker-compose.yml -f docker-compose.discovery.yml up -d
#
# Linux only (network_mode: host has no effect on Docker Desktop for Mac/Windows).
# The agent's port is on the LAN, so access is gated by the shared token.

services:
  # The main server learns where the agent is. These merge onto the base
  # service; everything else about it stays exactly the same.
  server:
    environment:
      DISCOVERY_AGENT_URL: "http://host.docker.internal:${DISCOVERY_AGENT_PORT:-3999}"
      DISCOVERY_AGENT_TOKEN: "${DISCOVERY_AGENT_TOKEN:?set DISCOVERY_AGENT_TOKEN in .env for LAN discovery}"
    extra_hosts:
      # Lets the bridged server reach the host-network agent by name.
      - "host.docker.internal:host-gateway"

  discovery:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: neevtime-server:latest
    container_name: attendance_discovery
    restart: unless-stopped
    # Share the host's network stack — the whole point. Gives the agent the
    # office LAN's interfaces, ARP table, and broadcast domain.
    network_mode: host
    # ping needs a raw ICMP socket to prime the ARP cache.
    cap_add:
      - NET_RAW
    command: ["node", "discovery-agent.js"]
    environment:
      DISCOVERY_AGENT_PORT: "${DISCOVERY_AGENT_PORT:-3999}"
      DISCOVERY_AGENT_TOKEN: "${DISCOVERY_AGENT_TOKEN:?set DISCOVERY_AGENT_TOKEN in .env for LAN discovery}"
