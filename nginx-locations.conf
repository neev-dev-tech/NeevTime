# Browser-facing locations, shared by the HTTP-only and TLS configurations so
# the two cannot drift apart. Included inside a server { } block.
#
# Every location that sets its own add_header must also include the security
# headers, because nginx does not inherit them into such a block — see
# nginx-security-headers.conf.

# Frontend routes
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    include /etc/nginx/security-headers.conf;
}

# Static assets caching
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
}

# API Proxy
location /api {
    proxy_pass $neevtime_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    include /etc/nginx/security-headers.conf;
}

# WebSocket Proxy
location /socket.io {
    proxy_pass $neevtime_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    include /etc/nginx/security-headers.conf;
}

# Health check endpoint. No security headers: the container healthcheck reads
# it and nothing about it is browser-facing.
location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
}
