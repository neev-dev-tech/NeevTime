# Security headers for browser-facing responses.
#
# Kept in its own file and included per-location rather than set once on the
# server block, because nginx's add_header does not inherit into any location
# that declares an add_header of its own — `location /` and the static-asset
# block both set Cache-Control, so server-level headers would silently vanish
# on exactly the responses that matter most.
#
# Deliberately NOT included in /iclock/. That path serves the readers, which are
# embedded HTTP clients that only need a bare "OK"; changed response headers
# there buy nothing and risk attendance collection. Nor /health, which the
# container healthcheck reads.
#
# `always` makes these apply to error responses too, not just 2xx.

# This app is never legitimately framed. Blocks clickjacking outright.
add_header X-Frame-Options "DENY" always;

# Stops a browser second-guessing a declared Content-Type — the vector that
# turns an uploaded document into an executed script.
add_header X-Content-Type-Options "nosniff" always;

# The URL carries employee ids and report parameters; do not leak them to any
# third party the browser is sent to.
add_header Referrer-Policy "no-referrer" always;

# Geolocation stays enabled for this origin: mobile punching needs it to match
# a geofence. Everything else is denied.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;

# REPORT-ONLY on purpose. A strict policy on a Vite/React build tends to break
# inline styles, the Socket.IO connection or blob workers, and the failure looks
# like a blank page rather than an error. Watch the browser console for
# violations first, then switch this to Content-Security-Policy to enforce it.
#
# ws:/wss: cover Socket.IO. blob: covers workers and generated PDF downloads.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# NOTE: Strict-Transport-Security is intentionally absent. It is meaningless
# without TLS and, once sent, can lock a browser into HTTPS-only for this host —
# which would make the app unreachable while it is still served over HTTP. Add
# it in the same change that introduces a certificate, not before.
