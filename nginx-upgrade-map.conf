# Connection header for proxied WebSocket upgrades.
#
# The socket.io block used to hardcode `Connection "upgrade"`, which sends that
# header on every request to /socket.io — including the plain XHR polling
# requests engine.io makes before and alongside the upgrade. engine.io rejects
# those with 400, so the live monitor fell back to polling, retried, and filled
# the browser console with:
#
#   WebSocket connection to 'wss://.../socket.io/' failed:
#     Error during WebSocket handshake: Unexpected response code: 400
#
# Ten of the forty-seven screens produced it. The application still worked —
# socket.io degrades to polling — which is why it survived unnoticed.
#
# `upgrade` only when the client actually asked to upgrade; `close` otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
