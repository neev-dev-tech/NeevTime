# Checks that run before anything reaches the VM.
#
# Two regressions reached production in a single afternoon — a crash on the
# Employees page and an emptied Resign list — and both were caught only after a
# person opened the app. The build was green for both. This runs the checks that
# would have caught them, on every push, before a merge rather than after a
# deploy.
#
# Node 20 to match the Dockerfile. Testing on a version the image does not use
# proves something about a runtime nobody runs.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client build and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      # `npm run build` runs lint:break and check-modal-guards first. Both exist
      # because a green vite build had already waved a defect through: esbuild
      # does not resolve identifiers, so a missing import ships as a blank page.
      - name: Build (runs lint:break and the modal guard check)
        working-directory: client
        run: npm run build

      - name: Bundle size
        working-directory: client
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/*.js | sort -rh | head -5 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Test
        working-directory: server
        run: npm test

  reports-db:
    name: Registers and payroll (real Postgres)
    runs-on: ubuntu-latest
    # These two services shipped four separate failures in one afternoon, every
    # one invisible to the suite that stubs the database: an unused $1 Postgres
    # rejects outright, columns this deployment did not have, a column nothing
    # writes read instead of the one the engine fills, and String(date) against
    # the Date objects pg returns. The stub answered with strings where pg
    # answers with Dates, so it was not an incomplete mock but a differently
    # shaped one — which is worse, because it produced confidence.
    #
    # This gives the database a vote.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Start Postgres
        run: |
          docker run -d --name pgr -e POSTGRES_PASSWORD=ci -p 5433:5432 postgres:15-alpine

          # Readiness here is harder than it looks, and two runs of this job were
          # lost to it.
          #
          # On first start the image runs initdb, brings up a TEMPORARY server so
          # init scripts can run, stops it, then starts the real one. That
          # temporary server answers on the unix socket, so both `pg_isready` and
          # `psql -c 'SELECT 1'` run via `docker exec` return success during
          # initialisation — and moments later the socket is gone and the next
          # step dies with "connection to server on socket failed".
          #
          # The temporary server is started with listen_addresses='' and so
          # accepts no TCP connection at all. Checking over TCP from the runner
          # is therefore a question only the real server can answer.
          export PGPASSWORD=ci
          ready=0
          for i in $(seq 1 60); do
            if psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -c 'SELECT 1' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Postgres never accepted a TCP connection"
            docker logs pgr | tail -30
            exit 1
          fi
          echo "Postgres accepted a TCP query after ${i}s"

      - name: Build the schema the way a fresh install does
        run: |
          docker exec pgr psql -U postgres -q -c "CREATE DATABASE neevtime_ci" >/dev/null

          # Every file, in sorted order — not a hand-picked five. The first
          # version of this step listed five and dropped schema_leaves.sql, so
          # leave_applications did not exist, and the leave assertions in the
          # test quietly did nothing because their seed insert is best-effort.
          #
          # Two passes: these files have order dependencies between them, and a
          # table created in pass one lets a foreign key in pass two resolve.
          # Everything is CREATE ... IF NOT EXISTS, so a second pass is cheap.
          #
          # Errors are counted and printed rather than sent to /dev/null. Some
          # are expected (the files overlap), but a silent load is how this step
          # reported success while building a database missing three tables.
          for pass in 1 2; do
            echo "--- pass $pass"
            for f in database/*.sql; do
              errs=$(docker exec -i pgr psql -U postgres -q -d neevtime_ci \
                       -v ON_ERROR_STOP=0 < "$f" 2>&1 | grep -c '^ERROR' || true)
              echo "  $(basename "$f"): $errs error(s)"
            done
          done
      - name: Boot once so ensureSchema runs
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: '5433'
          DB_NAME: neevtime_ci
          DB_USER: postgres
          DB_PASSWORD: ci
          PORT: '3998'
          # Throwaway, this container only. routes/auth.js refuses to load
          # without it, and on the first run the server died on exactly this
          # line — `|| true` swallowed it, ensureSchema never ran, and the tests
          # skipped on a missing column instead of reporting a dead boot.
          JWT_SECRET: ci-only-not-a-real-secret
        run: |
          npm ci
          # The boot is expected to be killed by timeout; that is not a failure.
          # A boot that exits early is, so the log is checked below rather than
          # trusted.
          timeout 25 node server.js > /tmp/boot.log 2>&1 || true
          tail -5 /tmp/boot.log || true

      - name: Verify ensureSchema actually ran
        run: |
          # Without this, any future boot failure degrades into "tests skipped"
          # again. Assert the columns the services read are really present, and
          # print the boot log when they are not.
          missing=""
          for pair in "employees deleted_at" "employees attendance_required" \
                      "attendance_daily_summary ot_minutes" \
                      "attendance_daily_summary late_minutes"; do
            set -- $pair
            found=$(docker exec pgr psql -U postgres -d neevtime_ci -tAc \
              "SELECT 1 FROM information_schema.columns
                WHERE table_name='$1' AND column_name='$2'")
            [ "$found" = "1" ] || missing="$missing $1.$2"
          done
          if [ -n "$missing" ]; then
            echo "::error::ensureSchema did not create:$missing"
            echo "--- boot log ---"
            cat /tmp/boot.log
            exit 1
          fi
          echo "ensureSchema built every column the registers read"

      - name: Run the registers against it
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: '5433'
          DB_NAME: neevtime_ci
          DB_USER: postgres
          DB_PASSWORD: ci
        run: |
          # pipefail, and it is not optional. Without it the exit status of this
          # step is tee's, which is always 0 — the previous version reported the
          # whole job green while all five tests were failing. A guard that only
          # catches skips, wrapped in a pipe that discards failures, is worse
          # than no guard: it reads as coverage.
          set -o pipefail
          node --test tests/registers_db.test.js 2>&1 | tee /tmp/db-tests.log
          status=$?

          # A skipped run is not a pass either. If the database were unreachable
          # these tests would quietly skip, which is the exact shape of the
          # problem they exist to prevent.
          if grep -qE '^# skipped [1-9]' /tmp/db-tests.log; then
            echo "::error::the real-database tests skipped — the database was not reachable"
            exit 1
          fi
          exit $status

      - name: Prove the schema is the shape the code writes
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: '5433'
          DB_NAME: neevtime_ci
          DB_USER: postgres
          DB_PASSWORD: ci
        run: |
          # Seventeen tables were once defined more than once across
          # database/*.sql, every one with CREATE TABLE IF NOT EXISTS. The first
          # file loaded won, the rest were silent no-ops, and a fresh install got
          # whichever shape sorted first — which for areas and devices was a
          # shape the application cannot write to. Nothing failed: the load
          # reported zero errors, the boot succeeded, and the Areas and Devices
          # pages returned 500 to the first person who opened them.
          #
          # This runs the application's own statements against the database this
          # job just built and fails if any of them cannot resolve, and it fails
          # if a table is ever again defined in two files at once.
          set -o pipefail
          node --test tests/schema_shape.test.js 2>&1 | tee /tmp/shape-tests.log
          status=$?

          if grep -qE '^# skipped [1-9]' /tmp/shape-tests.log; then
            echo "::error::the schema shape tests skipped — the database was not reachable"
            exit 1
          fi
          exit $status

  cutover:
    name: Split deployment serves the readers
    runs-on: ubuntu-latest
    env:
      # Consumed on first boot to create the administrator, so the smoke test
      # has a credential. CI-only: the stack and its volume are destroyed at the
      # end of the job. No fixed default exists in the product.
      ADMIN_PASSWORD: ci-only-first-admin
      SMOKE_PASS: ci-only-first-admin
    # The 145-day outage began with a deploy. The containers came up, nginx
    # answered, /api/health passed, and /iclock returned 502 to every reader
    # because Node was no longer in the container nginx proxied to. Nothing
    # tested the one path the system exists to serve.
    #
    # This brings the whole compose stack up exactly as the VM will and proves
    # that a punch can reach the application through nginx — not through :3001,
    # which answers 200 while the proxy in front of it is broken.
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: |
          # The db volume is declared external so that a missing volume fails
          # the deploy instead of silently starting an empty database. CI has no
          # such volume, so it makes one deliberately — which is exactly the
          # step a genuinely new install performs.
          docker volume create neevtime_postgres_data
          docker compose build client server
          docker compose up -d
          docker compose ps

      - name: Wait for the app to answer
        run: |
          for i in $(seq 1 60); do
            # -L and -k: with TLS on, port 80 redirects browser paths to HTTPS
            # and the certificate is self-signed. /iclock is checked separately
            # and deliberately without -L, because a reader cannot follow one.
            code=$(curl -skL -o /dev/null -w '%{http_code}' --max-time 3 http://localhost/api/health || true)
            [ "$code" = "200" ] && { echo "healthy after ${i}s"; break; }
            sleep 2
          done
          [ "$code" = "200" ] || {
            echo "::error::/api/health never returned 200 (last: ${code:-none})"
            docker compose logs --tail 60
            exit 1
          }

      - name: The readers must be able to reach /iclock
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost/iclock/cdata || true)
          echo "/iclock -> $code"
          case "$code" in
            502|504|000|"")
              echo "::error::/iclock is $code — nginx cannot reach the server container."
              echo "This is the exact state that lost 145 days of attendance."
              docker compose exec -T client sh -c 'nginx -T 2>/dev/null | grep -A4 "location /iclock"' || true
              docker compose logs --tail 40 client
              exit 1 ;;
          esac

      - name: TLS is served, and the config parses
        run: |
          docker compose exec -T client nginx -t
          code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 5 https://localhost/ || true)
          echo "https:// -> $code"
          [ "$code" = "200" ] || { echo "::error::HTTPS did not serve the app ($code)"; exit 1; }

          # Port 80 must keep serving /iclock in clear text whatever browsers
          # are redirected to: the readers speak plain HTTP and cannot follow a
          # redirect to TLS.
          iclock80=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost/iclock/cdata || true)
          case "$iclock80" in
            301|302|307|308)
              echo "::error::port 80 redirects /iclock to HTTPS ($iclock80) — the readers cannot follow it"
              exit 1 ;;
          esac
          echo "port 80 /iclock -> $iclock80"

      - name: Drive the critical paths
        run: |
          # Roadmap 0.3. The stack is up and the database is the one a new
          # customer gets, built from database/000_schema.sql — so this is the
          # first time the screens' endpoints are exercised on a fresh install.
          #
          # The Areas page returned 500 on every install for as long as it has
          # existed and nobody knew, because nothing ever asked it for a
          # response. That is the class of fault this catches.
          # Dump the evidence on failure rather than leaving a bare exit code.
          # A check that fails without saying why is the thing this whole job
          # exists to stop.
          node scripts/smoke.mjs || {
            echo "--- server boot log"
            docker compose logs --tail 80 server
            echo "--- users table"
            docker compose exec -T db psql -U postgres -d attendance_db \
              -c "SELECT username, role, is_active, length(password_hash) AS hash_len FROM users" || true
            echo "--- did the schema load at all"
            docker compose exec -T db psql -U postgres -d attendance_db \
              -c "SELECT count(*) AS tables FROM information_schema.tables WHERE table_schema='public'" || true
            exit 1
          }

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  isolation:
    name: Tenant isolation (real Postgres)
    runs-on: ubuntu-latest
    # Only meaningful once the tenancy migrations exist. On branches without
    # them this job is skipped rather than failing for the wrong reason.
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Are there tenancy migrations on this branch?
        run: |
          if [ -f server/migrations/001_multi_tenancy.sql ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No tenancy migrations on this branch — skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Start Postgres
        if: steps.check.outputs.present == 'true'
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -p 5432:5432 postgres:15-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Build the schema the way production builds it
        if: steps.check.outputs.present == 'true'
        env:
          PGPASSWORD: ci
        run: |
          createdb() { docker exec pg psql -U postgres -q -c "$1" >/dev/null; }
          docker exec pg psql -U postgres -q -c "CREATE DATABASE neevtime_ci" >/dev/null
          # Every file at the top level, not a hand-picked list. This step used to
          # name four files by path, and three of those paths stopped existing the
          # day the duplicated definitions were consolidated into
          # database/000_schema.sql — with `|| true` swallowing it, this job would
          # have gone on testing isolation against an empty database.
          for f in database/*.sql; do
            docker exec -i pg psql -U postgres -q -d neevtime_ci < "$f" >/dev/null 2>&1 || true
          done

      - name: Install and boot once so ensureSchema runs
        if: steps.check.outputs.present == 'true'
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: neevtime_ci
          DB_USER: postgres
          DB_PASSWORD: ci
          PORT: '3999'
        run: |
          npm ci
          timeout 25 node server.js > /tmp/boot.log 2>&1 || true
          tail -3 /tmp/boot.log || true

      - name: Apply migrations
        if: steps.check.outputs.present == 'true'
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: neevtime_ci
          DB_USER: postgres
          DB_PASSWORD: ci
        run: node migrations/runner.js up

      # The application role must not be a superuser. A superuser bypasses
      # row-level security, so the isolation tests would pass against a database
      # with no isolation at all — the one false negative that would matter.
      - name: Create the application role
        if: steps.check.outputs.present == 'true'
        run: |
          docker exec pg psql -U postgres -q -d neevtime_ci -c "
            CREATE ROLE neevtime_app LOGIN PASSWORD 'ci';
            GRANT USAGE ON SCHEMA public TO neevtime_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO neevtime_app;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO neevtime_app;
            GRANT EXECUTE ON FUNCTION app_current_tenant() TO neevtime_app;
            INSERT INTO companies (id, name, code)
              SELECT 2, 'CI Second Tenant', 'CI2'
              WHERE NOT EXISTS (SELECT 1 FROM companies WHERE id = 2);
          "

      - name: Prove one customer cannot reach another's data
        if: steps.check.outputs.present == 'true'
        working-directory: server
        env:
          TENANCY_TEST_DB: neevtime_ci
          TENANCY_TEST_HOST: localhost
          TENANCY_TEST_PORT: '5432'
          TENANCY_TEST_USER: neevtime_app
          TENANCY_TEST_PASSWORD: ci
        run: node --test tests/tenancy.test.js
