# The only part of NeevTime that faces the internet.
#
# The dashboard's nginx proxies `location /api` wholesale to the backend, which
# is correct on the office LAN and would be a serious mistake to expose: it
# fronts /api/login, /api/devices (the device command queue — it can push
# commands to the readers), /api/database and /api/system-logs. Publishing port
# 80 to reach the export would publish all of that with it.
#
# This gateway exists so the public surface is one path. Anything that is not
# /api/export/ does not exist here, including the dashboard itself.
#
# ── Why this container publishes no host port ────────────────────────────────
# It is reachable only from the compose network, which means only from
# cloudflared. That constraint is load-bearing, not tidiness: the block below
# passes CF-Connecting-IP through to the application, which reads it to decide
# whether the caller is on the customer's address allowlist. Cloudflare sets
# that header at its own edge and strips whatever the caller supplied, so it is
# trustworthy — but only because Cloudflare is genuinely the thing in front. If
# this port were ever published to the host and reached directly, a caller
# could set CF-Connecting-IP by hand and name any address they liked.
#
# If you ever expose this gateway by NAT/port-forward instead of a tunnel:
#   1. delete the CF-Connecting-IP line below, and
#   2. change X-Forwarded-For to `$remote_addr` so a caller cannot append to it.

server {
    listen 80;
    server_name _;

    # Do not advertise the version to the internet.
    server_tokens off;

    # Punch batches are small JSON; nothing here accepts an upload.
    client_max_body_size 64k;

    location /api/export/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Everything else — the dashboard, the login route, the device API, a
    # scan for /.env or /admin — gets the same answer as a path that was never
    # built. No redirect, no hint that there is more here.
    location / {
        return 404;
    }
}
