# The ADMS device path, kept separate and deliberately plain.
#
# These are eSSL readers running iClock firmware — embedded HTTP clients that
# expect little more than "OK" back. They get no security headers, no redirect
# and no TLS: a browser hardening measure cannot help them, and anything that
# changes the shape of a response here risks attendance collection, which is the
# one thing this system exists to do.
#
# This is why the TLS configuration cannot simply redirect all of port 80 to
# HTTPS. Port 80 must keep serving this path in clear text for the readers,
# whatever browsers are doing.

location /iclock/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
}
