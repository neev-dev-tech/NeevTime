version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: attendance_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-attendance_db}
      # Timestamp columns are `timestamp without time zone`, so NOW() stores the
      # container's wall clock. Running the database in UTC while devices write
      # IST punch times put two conventions in one schema and made every
      # created_at read 5h30m early. Both services now run in the same zone.
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
      PGTZ: ${APP_TIMEZONE:-Asia/Kolkata}
    # The server-side timezone comes from postgresql.conf, which initdb already
    # wrote as UTC on first boot — the env vars above only affect client
    # sessions and the shell. This overrides the running server, which is what
    # NOW() actually reads. No data is rewritten; only new writes change.
    command: postgres -c timezone=${APP_TIMEZONE:-Asia/Kolkata} -c log_timezone=${APP_TIMEZONE:-Asia/Kolkata}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_app
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${API_PORT:-3001}:3001"
      - "${ADMS_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
      PORT: 3001
      SERVER_URL: ${SERVER_URL:-http://localhost}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-attendance_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMS_PORT: 8080
      # Comma-separated list of browser origins allowed for API + Socket.IO,
      # e.g. "https://attendance.example.com". "*" disables the check — do not
      # use in production.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${SERVER_URL:-http://localhost}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/logs:/app/logs
      - ./server/backups:/app/backups
    networks:
      - attendance-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  attendance-network:
    driver: bridge

